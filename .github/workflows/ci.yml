name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Schema and tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run validate
      - run: npm test
      - run: npm run typecheck

  duskevm-genesis:
    name: DuskEVM part matches duskevm-genesis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dusk-network/duskevm-genesis
          path: duskevm-genesis
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/gen-duskevm.mjs duskevm-genesis --check
